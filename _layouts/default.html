<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rubenelcurioso - Software Engineer & Cybersecurity Enthusiast. Building secure, scalable digital solutions with expertise in Software Engineering and Cybersecurity.">
  <meta name="keywords" content="Software Engineer, Cybersecurity, Malware Analysis, Reverse Engineering, AI, Python, PHP, Java, C++, JavaScript, System Design, Network Security, Cloud Computing">
  <meta name="theme-color" content="#0c140e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f4ec" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="author" content="Rubenelcurioso">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Rubenelcurioso - Software Engineer & Cybersecurity Enthusiast>
  <meta property="og:description" content="Building secure, scalable digital solutions with expertise in Software Engineering and Cybersecurity">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rubenelcurioso.github.io">
  
  <title>{% if page.title %}{{ page.title }} - {% endif %}Rubenelcurioso | Software Engineer & Cybersecurity Enthusiast</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  
  <!-- Apply the saved theme before first paint -->
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  {{ content }}
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      var root = document.documentElement;
      function current() {
        return root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'night');
      }
      function label() {
        var next = current() === 'paper' ? 'night' : 'paper';
        btn.textContent = 'change_' + next + '.sh';
        btn.setAttribute('aria-label', 'Switch to ' + next + ' theme');
      }
      btn.addEventListener('click', function () {
        var next = current() === 'paper' ? 'night' : 'paper';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        label();
      });
      label();
    })();
  </script>
</body>
</html>
